[package]
name = "freero-desktop"
version = "0.1.0"
description = "Freero's desktop app: its own window around a Freero instance (#176, docs/desktop.md)"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "freero_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Tauri and its plugins are MIT / Apache-2.0 (dual), like serde and url.
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
