<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Freero server</title>
    <!-- The desktop app's only page of its own (#176): which Freero server the app opens. Everything
         else in the app is the server's web app. -->
    <style>
      :root {
        color-scheme: light dark;
        --ink: #17162b;
        --ink-2: #4b4a63;
        --primary: #5b3ff0;
        --primary-hover: #4a2fdc;
        --surface: #ffffff;
        --canvas: #f3f2f8;
        --line: #cfcde0;
        --danger: #c9353a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #ecebf5;
          --ink-2: #b9b8cc;
          --surface: #1d1c2e;
          --canvas: #141322;
          --line: #3a3950;
          --danger: #ff8a8e;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px;
        font: 14px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: var(--ink);
        background: var(--canvas);
      }
      main {
        padding: 24px;
        border-radius: 14px;
        background: var(--surface);
      }
      h1 {
        margin: 0 0 4px;
        font-size: 18px;
      }
      p {
        margin: 0 0 16px;
        color: var(--ink-2);
      }
      label {
        display: block;
        margin-block-end: 6px;
        font-weight: 600;
      }
      input {
        width: 100%;
        padding: 9px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        font: inherit;
        color: inherit;
        background: transparent;
      }
      .row {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-block-start: 16px;
      }
      button {
        padding: 9px 16px;
        border: 0;
        border-radius: 10px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .primary {
        color: #fff;
        background: var(--primary);
      }
      .primary:hover {
        background: var(--primary-hover);
      }
      .secondary {
        color: var(--ink);
        background: transparent;
        border: 1px solid var(--line);
      }
      #error {
        min-height: 1.5em;
        margin: 8px 0 0;
        color: var(--danger);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Your Freero server</h1>
      <p>The app opens this server’s boards. Self-hosting Freero? Enter your server’s address; the app restarts on it.</p>
      <form id="form">
        <label for="url">Server address</label>
        <input id="url" name="url" type="text" inputmode="url" autocomplete="url" spellcheck="false" placeholder="https://freero.example.com" required />
        <p id="error" role="alert"></p>
        <div class="row">
          <button type="button" class="secondary" id="reset">Use the default</button>
          <button type="submit" class="primary">Save and restart</button>
        </div>
      </form>
    </main>
    <script>
      const ipc = window.__TAURI_INTERNALS__;
      const input = document.getElementById('url');
      const error = document.getElementById('error');
      ipc.invoke('current_instance').then((url) => (input.value = url));
      const save = (url) =>
        ipc.invoke('set_instance', { url }).catch((e) => {
          error.textContent = String(e);
        });
      document.getElementById('form').addEventListener('submit', (e) => {
        e.preventDefault();
        error.textContent = '';
        save(input.value);
      });
      document.getElementById('reset').addEventListener('click', () => ipc.invoke('default_instance').then(save));
    </script>
  </body>
</html>
