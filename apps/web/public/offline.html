<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5b3ff0" />
    <link rel="icon" type="image/svg+xml" href="/freero.svg" />
    <title>Offline · Freero</title>
    <!-- Shown by the service worker (app/pwa/sw.ts) when a page can't be fetched. Self-contained:
         no scripts (CSP script-src 'self' forbids inline ones) and nothing from the network. -->
    <style>
      :root {
        color-scheme: light;
        --ink: #17162b;
        --ink-2: #4b4a63;
        --primary: #5b3ff0;
        --canvas: #f3f2f8;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        padding: 16px;
        font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: var(--ink);
        background: var(--canvas) radial-gradient(#cdcbdc 1px, transparent 1px) 0 0 / 24px 24px;
      }
      main {
        max-width: 420px;
        padding: 32px;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 12px 32px rgba(23, 22, 43, 0.16);
        text-align: center;
      }
      img {
        width: 48px;
        height: 48px;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: 22px;
      }
      p {
        margin: 0 0 24px;
        color: var(--ink-2);
      }
      a {
        display: inline-block;
        padding: 10px 18px;
        border-radius: 10px;
        background: var(--primary);
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid var(--ink);
        outline-offset: 3px;
      }
      @media (forced-colors: active) {
        a {
          border: 2px solid ButtonText;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/freero.svg" alt="" />
      <h1>You’re offline</h1>
      <p>Freero needs a connection to open your boards. Check your connection, then try again.</p>
      <a href="/app">Try again</a>
    </main>
  </body>
</html>
