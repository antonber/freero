<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Freero</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font: 16px/1.5 system-ui, sans-serif; color: #17162b; background: #f7f6fb; text-align: center; }
      main { max-width: 22rem; padding: 24px; }
      h1 { font-size: 1.25rem; margin: 0 0 8px; }
      p { margin: 0 0 16px; color: #4b4a63; }
      button { padding: 10px 20px; font: inherit; font-weight: 600; color: #fff; background: #5b3ff0; border: 0; border-radius: 10px; }
      @media (prefers-color-scheme: dark) { body { color: #f1f0f8; background: #17162b; } p { color: #c9c8da; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Freero can’t be reached</h1>
      <p>Check your connection. Boards you kept offline open once Freero has loaded.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
