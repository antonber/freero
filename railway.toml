# Railway (the hosted Freero; docs/deployment.md). Builds the repo's Dockerfile; a deploy only takes
# traffic once /readyz answers (database and storage reachable), and a crashed process restarts.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/readyz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
