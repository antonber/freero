name: desktop

# Freero's desktop app (#176, apps/desktop, docs/desktop.md): unsigned installers for Windows and
# macOS on every change to it, and a draft GitHub release (with the update manifest) for a
# `desktop-v*` tag. Signing and notarisation switch on when the owner adds the secrets listed in
# docs/desktop.md; without them everything still builds, unsigned.

on:
  push:
    tags: ['desktop-v*']
  pull_request:
    paths: ['apps/desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:
    inputs:
      instance:
        description: Server the app opens by default (self-hosters build their own)
        required: false
        default: ''

permissions:
  contents: write

env:
  TAURI_CLI: '@tauri-apps/cli@2.12.4'
  # Baked into the build (lib.rs); empty values fall back to the defaults there.
  FREERO_INSTANCE_URL: ${{ inputs.instance || vars.FREERO_INSTANCE_URL }}
  FREERO_UPDATER_ENDPOINT: ${{ vars.FREERO_UPDATER_ENDPOINT }}
  FREERO_UPDATER_PUBKEY: ${{ vars.FREERO_UPDATER_PUBKEY }}

jobs:
  # The shell's own logic (which links open where, which servers are accepted), on Linux.
  test:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: cargo test --locked

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      # Windows code signing (docs/desktop.md "Windows"): import the owner's .pfx and hand Tauri its
      # thumbprint (next step). No certificate: unsigned installers.
      - name: Windows signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) { Write-Host 'No WINDOWS_CERTIFICATE: building unsigned.'; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP 'windows-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pw = if ($env:WINDOWS_CERTIFICATE_PASSWORD) { ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force } else { New-Object System.Security.SecureString }
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item $pfx
          Add-Content -Path $env:GITHUB_ENV -Value "WINDOWS_CERT_THUMBPRINT=$($cert.Thumbprint)"
      # Each signing secret reaches the build only when it is set: Tauri acts on a variable that is
      # merely present (an empty APPLE_CERTIFICATE still makes it run `security import`, which
      # fails). Without the secrets everything builds, unsigned.
      - name: Signing and updater keys
        shell: bash
        env:
          # Updates (docs/desktop.md "Updates"): minisign key made with `tauri signer generate`.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS: Developer ID signing and notarisation (docs/desktop.md "macOS").
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          put() { # NAME VALUE -> $GITHUB_ENV, safe for multi-line values
            local d="EOF_${RANDOM}${RANDOM}${RANDOM}"
            { echo "$1<<$d"; printf '%s\n' "$2"; echo "$d"; } >> "$GITHUB_ENV"
          }
          conf='{}'
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo 'Updater key set: signed update artifacts.'
            put TAURI_SIGNING_PRIVATE_KEY "$TAURI_SIGNING_PRIVATE_KEY"
            # Passed even when empty: a key made without a password needs it set to "".
            put TAURI_SIGNING_PRIVATE_KEY_PASSWORD "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
            conf=$(jq -c '.bundle.createUpdaterArtifacts = true' <<<"$conf")
          fi
          if [ "$RUNNER_OS" = macOS ] && [ -n "$APPLE_CERTIFICATE" ]; then
            echo 'Apple certificate set: signed app.'
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do
              if [ -n "${!v}" ]; then put "$v" "${!v}"; fi
            done
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              echo 'Apple ID set: notarised.'
              for v in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do put "$v" "${!v}"; done
            fi
          fi
          if [ -n "$WINDOWS_CERT_THUMBPRINT" ]; then
            echo 'Windows certificate imported: signed installers.'
            conf=$(jq -c --arg t "$WINDOWS_CERT_THUMBPRINT" '.bundle.windows += {certificateThumbprint: $t, digestAlgorithm: "sha256", timestampUrl: "http://timestamp.digicert.com"}' <<<"$conf")
          fi
          if [ "$conf" = '{}' ]; then
            echo 'EXTRA_ARGS=' >> "$GITHUB_ENV"
          else
            # A file, not inline JSON: the action splits `args` on spaces and strips quotes.
            file="$(printf '%s' "$GITHUB_WORKSPACE" | tr '\\\\' /)/tauri.ci.conf.json"
            printf '%s\n' "$conf" > "$file"
            echo "EXTRA_ARGS=--config $file" >> "$GITHUB_ENV"
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop/src-tauri
          tauriScript: npx --yes ${{ env.TAURI_CLI }}
          args: --target ${{ matrix.target }} ${{ env.EXTRA_ARGS }}
          # A desktop-v* tag makes a draft release (the owner checks and publishes it).
          tagName: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name || '' }}
          releaseName: Freero desktop __VERSION__
          releaseDraft: true
          includeUpdaterJson: true
      - uses: actions/upload-artifact@v4
        with:
          name: freero-desktop-${{ matrix.target }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig
          if-no-files-found: error
