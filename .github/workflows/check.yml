name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Boundaries + types + unit tests (Dune: forbidden dependencies fail mechanically).
      - run: npm run check
      # Real-session end-to-end: real server, real Yjs WebSocket clients.
      - run: npm run verify
      - run: npm run build

  # The same real-session check against a real PostgreSQL 17 and Redis 7 (the job above uses the
  # built-in PGlite, no Redis). verify creates and drops its own databases on this server, starts
  # two instances at once on one empty database (migration advisory lock), and runs two instances
  # on one database + Redis with clients on each (realtime fan-out, persistence across instances).
  verify-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: freero
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:freero@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
